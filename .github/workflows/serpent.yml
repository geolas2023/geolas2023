name: Serpent des contributions

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpent.svg?color_snake=#b5651d&color_dots=#ebedf0,#f5d9b0,#e8b56f,#d4893a,#a45d18
            dist/serpent-sombre.svg?palette=github-dark&color_snake=#e0a458&color_dots=#161b22,#3b2c1a,#6b4a22,#a8722f,#e0a458
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
