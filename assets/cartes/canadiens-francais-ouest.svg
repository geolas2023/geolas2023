<text x="420" y="36" text-anchor="end" class="s" font-size="12" font-weight="600" fill="#e0a458">35 000+ fiches</text><text x="22" y="86" class="s" font-size="13" fill="#c5ccd3">Francophones d&#x27;Amérique du Nord, de la Nouvelle-France à</text><text x="22" y="105" class="s" font-size="13" fill="#c5ccd3">l&#x27;Ouest américain : chaque lieu daté, géolocalisé et rattaché</text><text x="22" y="124" class="s" font-size="13" fill="#c5ccd3">à ses sources paginées.</text><g transform="translate(22,140)"><rect width="71" height="20" rx="10" fill="#e0a458" fill-opacity=".14" stroke="#e0a458" stroke-opacity=".5"/><text x="35" y="14" text-anchor="middle" class="s" font-size="11" fill="#e0a458">MapLibre</text></g><g transform="translate(98.8,140)"><rect width="58" height="20" rx="10" fill="#e0a458" fill-opacity=".14" stroke="#e0a458" stroke-opacity=".5"/><text x="29" y="14" text-anchor="middle" class="s" font-size="11" fill="#e0a458">Python</text></g><g transform="translate(162.39999999999998,140)"><rect width="64" height="20" rx="10" fill="#e0a458" fill-opacity=".14" stroke="#e0a458" stroke-opacity=".5"/><text x="32" y="14" text-anchor="middle" class="s" font-size="11" fill="#e0a458">GeoJSON</text></g>
