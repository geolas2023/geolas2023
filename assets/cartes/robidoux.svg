<text x="420" y="36" text-anchor="end" class="s" font-size="12" font-weight="600" fill="#d0776b">200 lieux</text><text x="22" y="86" class="s" font-size="13" fill="#c5ccd3">Une famille de traiteurs, de Montréal à Saint-Louis, Santa Fe</text><text x="22" y="105" class="s" font-size="13" fill="#c5ccd3">et la Californie : lieux, routes, recensements, salle de</text><text x="22" y="124" class="s" font-size="13" fill="#c5ccd3">lecture et portraits.</text><g transform="translate(22,140)"><rect width="71" height="20" rx="10" fill="#d0776b" fill-opacity=".14" stroke="#d0776b" stroke-opacity=".5"/><text x="35" y="14" text-anchor="middle" class="s" font-size="11" fill="#d0776b">MapLibre</text></g><g transform="translate(98.8,140)"><rect width="84" height="20" rx="10" fill="#d0776b" fill-opacity=".14" stroke="#d0776b" stroke-opacity=".5"/><text x="42" y="14" text-anchor="middle" class="s" font-size="11" fill="#d0776b">Généalogie</text></g>
